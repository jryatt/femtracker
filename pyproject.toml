[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femtracker"
dynamic = ["version"]
description = "Track FEM studies, run them on an HPC over PuTTY/SSH, and store the results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.5"]
test = ["pytest>=8"]

[project.scripts]
femtracker = "femtracker.cli:main"

[tool.setuptools]
packages = ["femtracker", "femtracker.agent"]

[tool.setuptools.package-data]
femtracker = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "femtracker.__version__" }
